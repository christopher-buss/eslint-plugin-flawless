autoInstallPeers: true
catalogMode: prefer
cleanupUnusedCatalogs: true
dedupePeers: true
enableGlobalVirtualStore: true
enablePrePostScripts: true

minimumReleaseAgeExclude:
  - "@isentinel/tsconfig@3.0.0"

minimumReleaseAgeExcludePrune: true
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080

packages:
  - "src/*"

overrides:
  eslint-plugin-flawless: link:.
  eslint-plugin-yml: catalog:testing

patchedDependencies:
  eslint-rule-benchmark@0.8.0: patches/eslint-rule-benchmark.patch

catalogs:
  cli:
    "@antfu/ni": 30.2.0
    "@isentinel/eslint-config": 6.3.0
    "@typescript-eslint/eslint-plugin": 8.72.2
    "@typescript-eslint/parser": 8.72.2
    bumpp: 11.1.0
    eslint: 10.14.0
    eslint-plugin-pnpm: 1.6.1
    jiti: 2.7.0
    lint-staged: 17.0.8
    oxc-parser: 0.158.0
    oxfmt: 0.78.0
    oxlint-tsgolint: 7.0.2006
    simple-git-hooks: 2.13.1
    ts-api-utils: 2.5.0
    tsdown: 0.22.9
    tsx: 4.22.4
    typescript: 6.0.3
  runtime:
    "@eslint-react/core": ^5.10.0
    "@oxlint/plugins": ^1.78.0
    "@typescript-eslint/scope-manager": ^8.62.1
    "@typescript-eslint/utils": ^8.62.1
    jsonc-eslint-parser: ^3.1.0
    natural-compare: ^1.4.0
    synckit: ^0.11.13
    toml-eslint-parser: ^1.0.3
  testing:
    "@eslint/markdown": 8.0.3
    "@vitest/eslint-plugin": 1.6.20
    eslint-plugin-eslint-plugin: 7.6.2
    eslint-plugin-n: 18.2.1
    eslint-plugin-toml: 1.4.0
    eslint-plugin-yml: 3.5.0
    eslint-vitest-rule-tester: 3.1.0
    oxlint: 1.93.0
    publint: 0.3.21
    unplugin-unused: 0.5.7
    vitest: 4.1.9
    yaml-eslint-parser: 2.0.0
  types:
    "@isentinel/tsconfig": 3.0.0
    "@types/natural-compare": 1.4.3
    "@types/node": 24.0.13
  utils:
    eslint-doc-generator: 3.6.0
    eslint-rule-benchmark: 0.8.0

allowBuilds:
  esbuild: true
  simple-git-hooks: true

configDependencies:
  "@isentinel/pnpm-plugin-eslint-config": 6.3.0

permissions:
  eslint-vitest-rule-tester:
    skills: true

skills:
  dirs:
    - .agents/skills
    - .claude/skills
