name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: lts/*

      - run: pnpm i -g @antfu/ni
      - run: nci
      - run: nr build
      - run: nr lint:ci
      - run: nr typecheck
      - run: nr check:dts

  test:
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      # The global virtual store keeps symlinks in the store's `links`
      # directory. The cache extracts with `tar -P`, which on Windows creates
      # a link before its target and so makes a file symlink to a directory
      # that cannot be read (os error 5). Cache only the package files and
      # their index; the install creates `links` again.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            ${{ steps.pnpm-store.outputs.path }}/files
            ${{ steps.pnpm-store.outputs.path }}/index.db
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm i -g @antfu/ni
      - run: nci
      - run: nr build
      - run: nr test

    strategy:
      matrix:
        node: [lts/*]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: true

  # no-redundant-type-annotation's verifier uses compiler APIs across the whole
  # peer range. The test job covers the catalog version; this covers the rest.
  typescript-compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: lts/*

      - run: pnpm i -g @antfu/ni
      - run: nci
      - run: pnpm add -D typescript@${{ matrix.typescript }}
      - run: pnpm vitest run src/rules/no-redundant-type-annotation/verify.spec.ts

    strategy:
      fail-fast: false
      matrix:
        typescript: [4.8.4, 5.0.4, 5.4.5, 5.9.3]
