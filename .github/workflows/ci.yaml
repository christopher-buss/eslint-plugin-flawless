name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: lts/*

      - run: pnpm i -g @antfu/ni
      - run: nci
      - run: nr build
      - run: nr lint:ci
      - run: nr typecheck
      - run: nr check:dts

  test:
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: ${{ matrix.node }}

      - run: pnpm i -g @antfu/ni
      - run: nci
      - run: nr build
      - run: nr test

    strategy:
      matrix:
        node: [lts/*]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: true

  # no-redundant-type-annotation's verifier uses compiler APIs across the whole
  # peer range. The test job covers the catalog version; this covers the rest.
  typescript-compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: lts/*

      - run: pnpm i -g @antfu/ni
      - run: nci
      - run: pnpm add -D typescript@${{ matrix.typescript }}
      - run: pnpm vitest run src/rules/no-redundant-type-annotation/verify.spec.ts

    strategy:
      fail-fast: false
      matrix:
        typescript: [4.8.4, 5.0.4, 5.4.5, 5.9.3]
